    <script>
        // --- NGUỒN DỮ LIỆU ---
        let knowledge_components = []; // Dữ liệu cho BÊN PHẢI (ma trận)
        // Biến này sẽ lưu trữ dữ liệu thô từ mock
        let knowledgeSourceDataSrc = null; 

        // --- CÁC HÀM CHO BÊN TRÁI (KNOWLEDGE CONTENT) ---

        /**
         * Render cây kiến thức (BÊN TRÁI)
         * Hàm này giờ NHẬN dữ liệu chapters đã được lọc
         */
        function renderKnowledgeContent(chaptersData) {
            const container = document.getElementById('content-placeholder');
            if (!container) return;

            // Xóa sạch nội dung cây kiến thức cũ
            container.innerHTML = '';
            // Reset mảng component ma trận
            knowledge_components = [];
            renderExamTable(); // Cập nhật bảng ma trận (thành rỗng)

            let allHtmlContent = '';

            // Lặp qua 'chaptersData' (tham số)
            if (!chaptersData || chaptersData.length === 0) {
                container.innerHTML = '<p class="text-muted p-4">Không tìm thấy nội dung kiến thức.</p>';
                return;
            }
            
            chaptersData.forEach(chapter => {
                const chapterTextId = `text-chapter-${chapter.chapter_id}`;
                const chapterContentId = `content-chapter-${chapter.chapter_id}`;

                let lessonsHtml = '';
                // Kiểm tra xem lessons có tồn tại không
                if (chapter.lessons && Array.isArray(chapter.lessons)) {
                    chapter.lessons.forEach(lesson => {
                        const lessonTextId = `text-lesson-${lesson.lesson_id}`;
                        const lessonContentId = `content-lesson-${lesson.lesson_id}`;

                        let knowledgeHtml = '';
                        
                        // Kiểm tra xem knowledge_units có tồn tại không
                        if (lesson.knowledge_units && Array.isArray(lesson.knowledge_units)) {
                            lesson.knowledge_units.forEach(content => {
                                const knowledgeTextId = `text-knowledge-${content.knowledge_id}`; 
                                
                                knowledgeHtml += `
                                <div class="flex gap-2 items-start">
                                    <div class="flex items-center mt-0.5">
                                        <input type="checkbox" 
                                            data-target-text="${knowledgeTextId}"
                                            data-type="knowledge"
                                            data-chapter-id="${chapter.chapter_id}"
                                            data-lesson-id="${lesson.lesson_id}"
                                            data-knowledge-id="${content.knowledge_id}"
                                            data-content="${content.content}"
                                            class="w-5 h-5 text-black border-gray-300 rounded-full focus:ring-black focus:ring-2 cursor-pointer" />
                                    </div>
                                    <p id="${knowledgeTextId}" class="text-sm font-medium text-black leading-5">
                                        ${content.content}
                                    </p>
                                </div>
                                `;
                            });
                        }


                        lessonsHtml += `
                        <div class="space-y-3">
                            <div class="lesson flex items-center justify-between cursor-pointer" data-toggle-target="#${lessonContentId}">
                                <div class="flex gap-2 items-center">
                                    <div class="flex items-center mt-0.5">
                                        <input type="checkbox" 
                                            data-target-text="${lessonTextId}"
                                            data-type="lesson"
                                            data-chapter-id="${chapter.chapter_id}"
                                            data-lesson-id="${lesson.lesson_id}"
                                            data-knowledge-id="" 
                                            data-content="${lesson.lesson_name}"
                                            class="w-5 h-5 text-black border-gray-300 rounded-full focus:ring-black focus:ring-2 cursor-pointer" />
                                    </div>
                                    <p id="${lessonTextId}" class="text-base font-medium text-black">${lesson.lesson_name}</p>
                                </div>
                                <div class="w-6 h-6 flex-shrink-0">
                                    <svg class="w-full h-full text-black rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                    </svg>
                                </div>
                            </div>
                            <div id="${lessonContentId}" class="hidden space-y-3 ml-8">
                                ${knowledgeHtml}
                            </div>
                        </div>
                        `;
                    });
                }


                allHtmlContent += `
                <div class="bg-white rounded-xl border border-gray-200">
                    <div class="chapter p-4 cursor-pointer" data-toggle-target="#${chapterContentId}">
                        <h2 class="text-base font-bold text-black mb-2">Chương ${chapter.chapter_number}</h2>
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2 flex-1">
                                <input type="checkbox" 
                                    data-target-text="${chapterTextId}"
                                    data-type="chapter"
                                    data-chapter-id="${chapter.chapter_id}"
                                    data-lesson-id=""
                                    data-knowledge-id=""
                                    data-content="${chapter.chapter_name}"
                                    class="w-5 h-5 text-black border-gray-300 rounded-full focus:ring-black focus:ring-2 cursor-pointer" />
                                <p id="${chapterTextId}" class="text-base font-medium text-black leading-5 flex-1">
                                    ${chapter.chapter_name}
                                </p>
                            </div>
                            <div class="w-6 h-6 flex-shrink-0">
                                <svg class="w-full h-full text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                </svg>
                            </div>
                        </div>
                    </div>
                    <div id="${chapterContentId}" class="chapter-content hidden px-4 pb-4 space-y-4">
                        ${lessonsHtml}
                    </div>
                </div>
                `;
            });

            container.innerHTML = allHtmlContent;

            // Gắn sự kiện bung/thu gọn
            addToggleListeners();
            // Gắn sự kiện cho checkbox
            addKnowledgeCheckboxListeners();
        }

        /**
         * Gắn sự kiện bung/thu gọn cho Chapter và Lesson
         */
        function addToggleListeners() {
            // Logic bung/thu gọn Chapter
            document.querySelectorAll(".chapter").forEach(chapter => {
                chapter.addEventListener("click", () => {
                    const targetId = chapter.dataset.toggleTarget;
                    if (!targetId) return;
                    const content = document.querySelector(targetId);
                    if (content) {
                        content.classList.toggle("hidden");
                        const iconPath = chapter.querySelector("svg path");
                        if (iconPath) {
                            const isHidden = content.classList.contains("hidden");
                            iconPath.setAttribute("d", isHidden ? "M19 9l-7 7-7-7" : "M5 15l7-7 7 7");
                        }
                    }
                });
            });

            // Logic bung/thu gọn Lesson
            document.querySelectorAll(".lesson").forEach(lesson => {
                lesson.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const targetId = lesson.dataset.toggleTarget;
                    if (!targetId) return;
                    const content = document.querySelector(targetId);
                    if (content) {
                        content.classList.toggle("hidden");
                        const icon = lesson.querySelector("svg");
                        if (icon) {
                            icon.classList.toggle("rotate-180");
                        }
                    }
                });
            });
        }

        /**
         * Gắn sự kiện 'change' cho các checkbox bên trái
         */
        function addKnowledgeCheckboxListeners() {
            document.querySelectorAll('#content-placeholder input[type="checkbox"]').forEach(checkbox => {
                checkbox.addEventListener('change', handleKnowledgeCheckboxChange);
                
                checkbox.addEventListener('click', (e) => {
                   e.stopPropagation(); 
                });
            });
        }

        /**
         * HÀM "CẦU NỐI"
         * Xử lý khi checkbox bên trái thay đổi
         */
        function handleKnowledgeCheckboxChange(event) {
            const checkbox = event.target;
            const isChecked = checkbox.checked;
            
            const chapterId = checkbox.dataset.chapterId;
            const lessonId = checkbox.dataset.lessonId || null; 
            const knowledgeId = checkbox.dataset.knowledgeId || null; 
            const content = checkbox.dataset.content;

            // Xử lý đổi màu text bên trái
            const targetTextId = checkbox.dataset.targetText;
            if (targetTextId) {
                const textElement = document.getElementById(targetTextId);
                if (textElement) {
                    textElement.classList.toggle('text-green-600', isChecked);
                    textElement.classList.toggle('text-black', !isChecked);
                }
            }

            // Xử lý cập nhật dữ liệu bảng bên phải
            if (isChecked) {
                const newItem = {
                    "chapter_id": parseInt(chapterId),
                    "lesson_id": lessonId ? parseInt(lessonId) : null,
                    "knowledge_id": knowledgeId ? parseInt(knowledgeId) : null,
                    "content": content,
                    "recognition": 0, "understanding": 0, "application": 0,
                    "multiple_choice": 0, "essay": 0, "true_false": 0, "fill_in_blank": 0,
                    "total_points": 0
                };
                knowledge_components.push(newItem); 
            } else {
                knowledge_components = knowledge_components.filter(item => { 
                    const matchChapter = item.chapter_id == chapterId;
                    const matchLesson = (item.lesson_id || null) == lessonId;
                    const matchKnowledge = (item.knowledge_id || null) == knowledgeId;
                    return !(matchChapter && matchLesson && matchKnowledge);
                });
            }
            console.log(knowledge_components);
            renderExamTable();
        }

        // --- CÁC HÀM CHO BÊN PHẢI (EXAM TABLE) ---

        function renderExamTable() {
            renderTableBody();
            calculateAndRenderTotals();
            addTableInputListeners(); 
        }

        /**
         * Render phần thân của bảng
         */
        function renderTableBody() {
            const tableBody = document.getElementById('table-body');
            if (!tableBody) return;

            let tableRowsHtml = '';
            let stt = 1;

            knowledge_components.forEach((item, index) => { 
                const pathString = `${index}`; 
                tableRowsHtml += createTableRow(item, stt++, pathString);
            });

            tableBody.innerHTML = tableRowsHtml;
        }

        /**
         * Tạo HTML cho một hàng (tr) của bảng bên phải
         */
        function createTableRow(item, stt, pathString) {
            const content = item.content;
            
            const createInput = (property, value) => {
                return `<input 
                            type="number" 
                            min="0" 
                            class="w-12 text-center border border-gray-300 rounded px-2 py-1 text-xs" 
                            value="${value}" 
                            data-path="${pathString}" 
                            data-property="${property}"
                        >`;
            };

            return `
                <tr class="border-t border-gray-200 hover:bg-gray-50">
                    <td class="px-4 py-3 text-center text-sm text-gray-600 border-r border-gray-200">${stt}</td>
                    <td class="px-4 py-3 text-sm border-r border-gray-200">${content}</td>
                    <td class="px-3 py-3 text-center text-sm text-gray-600 border-r border-gray-200">${createInput('recognition', item.recognition)}</td>
                    <td class="px-3 py-3 text-center text-sm text-gray-600 border-r border-gray-200">${createInput('understanding', item.understanding)}</td>
                    <td class="px-3 py-3 text-center text-sm text-gray-600 border-r border-gray-200">${createInput('application', item.application)}</td>
                    <td class="px-3 py-3 text-center text-sm text-gray-600 border-r border-gray-200">${createInput('multiple_choice', item.multiple_choice)}</td>
                    <td class="px-3 py-3 text-center text-sm text-gray-600 border-r border-gray-200">${createInput('essay', item.essay)}</td>
                    <td class="px-3 py-3 text-center text-sm text-gray-600 border-r border-gray-200">${createInput('true_false', item.true_false)}</td>
                    <td class="px-3 py-3 text-center text-sm text-gray-600 border-r border-gray-200">${createInput('fill_in_blank', item.fill_in_blank)}</td>
                    <td class="px-4 py-3 text-center text-sm text-gray-600">${createInput('total_points', item.total_points)}</td>
                </tr>
            `;
        }

        function updateTotals(item, totals) {
            totals.recognition += item.recognition || 0;
            totals.understanding += item.understanding || 0;
            totals.application += item.application || 0;
            totals.multiple_choice += item.multiple_choice || 0;
            totals.essay += item.essay || 0;
            totals.true_false += item.true_false || 0;
            totals.fill_in_blank += item.fill_in_blank || 0;
            totals.total_points += item.total_points || 0;
        }

        /**
         * Tính toán và render tổng
         */
        function calculateAndRenderTotals() {
            const totals = {
                recognition: 0, understanding: 0, application: 0,
                multiple_choice: 0, essay: 0, true_false: 0, fill_in_blank: 0,
                total_points: 0
            };

            knowledge_components.forEach(item => { 
                updateTotals(item, totals);
            });

            document.getElementById('total-recognition').textContent = totals.recognition;
            document.getElementById('total-understanding').textContent = totals.understanding;
            document.getElementById('total-application').textContent = totals.application;
            document.getElementById('total-multiple_choice').textContent = totals.multiple_choice;
            document.getElementById('total-essay').textContent = totals.essay;
            document.getElementById('total-true_false').textContent = totals.true_false;
            document.getElementById('total-fill_in_blank').textContent = totals.fill_in_blank;
            document.getElementById('total-total_points').textContent = totals.total_points;
        }

        /**
         * Xử lý thay đổi input TRÊN BẢNG BÊN PHẢI
         */
        function handleTableInputChange(event) {
            const input = event.target;
            const pathIndex = input.dataset.path;     
            const property = input.dataset.property;
            
            let newValue = parseInt(input.value) || 0;
            if (newValue < 0) {
                newValue = 0;
                input.value = 0; 
            }

            const targetObject = knowledge_components[pathIndex]; 

            if (targetObject) {
                targetObject[property] = newValue;
            }
            
            calculateAndRenderTotals();
        }

        /**
         * Gắn sự kiện cho các input TRÊN BẢNG BÊN PHẢI
         */
        function addTableInputListeners() {
            document.querySelectorAll('#table-body input[type="number"]').forEach(input => {
                input.addEventListener('input', handleTableInputChange); 
            });
        }

        // --- KHỞI CHẠY ---
        document.addEventListener('DOMContentLoaded', function () {
            
            // Lấy DOM element cho các filter
            const gradeDropdown = document.getElementById('grade-dropdown');
            const subjectDropdown = document.getElementById('subject-dropdown');
            const bookNameDropdown = document.getElementById('book-name-dropdown');
            const contentPlaceholder = document.getElementById('content-placeholder');

            // --- 1. TẢI DỮ LIỆU GỐC (1 LẦN) ---
            // Dùng tên biến bạn gợi ý: knowledgeSourceDataSrc
            knowledgeSourceDataSrc = window.APP_MOCK_DATA.getKnowledgeDataJSON();
            window.APP_STATE.setKnowledgeSourceData(knowledgeSourceDataSrc);
            // (Không cần lưu vào state nếu state.js không có hàm setKnowledgeSourceData)
            // if (APP_STATE.setKnowledgeSourceData) {
            //     APP_STATE.setKnowledgeSourceData(knowledgeSourceDataSrc);
            // }


            // --- 2. CÁC HÀM ĐIỀN DỮ LIỆU FILTER ---

            /**
             * Hàm trợ giúp điền data vào dropdown
             * @param {HTMLSelectElement} dropdown - Element <select>
             * @param {Array} data - Mảng dữ liệu (ví dụ: education_data)
             * @param {String} valueKey - Key để lấy value (ví dụ: 'grade_level_name')
             * @param {String} textKey - Key để lấy text (ví dụ: 'grade_level_name')
             * @param {String} placeholder - Text hiển thị mặc định
             */
            function populateDropdown(dropdown, data, valueKey, textKey, placeholder) {
                dropdown.innerHTML = `<option value="">${placeholder}</option>`;
                if (data && Array.isArray(data)) {
                    data.forEach(item => {
                        const option = document.createElement('option');
                        option.value = item[valueKey];
                        option.textContent = item[textKey];
                        dropdown.appendChild(option);
                    });
                }
                // Bật/tắt dropdown
                dropdown.disabled = (!data || data.length === 0);
            }

            /**
             * Hàm xóa sạch nội dung cây kiến thức và ma trận
             */
            function clearContent() {
                contentPlaceholder.innerHTML = '<p class="text-muted p-4">Vui lòng chọn đầy đủ filter...</p>';
                knowledge_components = [];
                renderExamTable(); // Cập nhật (xóa) bảng ma trận
            }

            // --- 3. LOGIC ĐIỀN DỮ LIỆU VÀ GẮN SỰ KIỆN ---

            // 3.1. Điền "Khối"
            populateDropdown(
                gradeDropdown, 
                knowledgeSourceDataSrc.education_data, 
                'grade_level_name', 
                'grade_level_name', 
                'Chọn khối'
            );
            // Mặc định, xóa nội dung
            clearContent();

            // 3.2. Sự kiện khi chọn "Khối"
            gradeDropdown.addEventListener('change', () => {
                const selectedGradeName = gradeDropdown.value;
                
                // Reset các filter con và nội dung
                populateDropdown(subjectDropdown, [], '', '', 'Chọn môn học');
                populateDropdown(bookNameDropdown, [], '', '', 'Chọn sách');
                clearContent();

                if (selectedGradeName) {
                    const selectedGrade = knowledgeSourceDataSrc.education_data.find(
                        g => g.grade_level_name === selectedGradeName
                    );
                    if (selectedGrade && selectedGrade.subjects) {
                        populateDropdown(
                            subjectDropdown, 
                            selectedGrade.subjects, 
                            'subject_name', 
                            'subject_name', 
                            'Chọn môn học'
                        );
                    }
                }
            });

            // 3.3. Sự kiện khi chọn "Môn học"
            subjectDropdown.addEventListener('change', () => {
                const selectedGradeName = gradeDropdown.value;
                const selectedSubjectName = subjectDropdown.value;

                // Reset filter con và nội dung
                populateDropdown(bookNameDropdown, [], '', '', 'Chọn sách');
                clearContent();

                if (selectedGradeName && selectedSubjectName) {
                    const selectedGrade = knowledgeSourceDataSrc.education_data.find(
                        g => g.grade_level_name === selectedGradeName
                    );
                    const selectedSubject = selectedGrade.subjects.find(
                        s => s.subject_name === selectedSubjectName
                    );
                    
                    if (selectedSubject && selectedSubject.books) {
                        populateDropdown(
                            bookNameDropdown, 
                            selectedSubject.books, 
                            'book_name', 
                            'book_name', 
                            'Chọn sách'
                        );
                    }
                }
            });

            // 3.4. Sự kiện khi chọn "Book Name" (Bước cuối)
            bookNameDropdown.addEventListener('change', () => {
                const selectedGradeName = gradeDropdown.value;
                const selectedSubjectName = subjectDropdown.value;
                const selectedBookName = bookNameDropdown.value;
                
                clearContent(); // Xóa nội dung cũ
                console.log(window.APP_STATE.getKnowledgeSourceData());
                console.log(selectedGradeName, selectedSubjectName, selectedBookName);

                if (selectedGradeName && selectedSubjectName && selectedBookName) {
                    // Gọi hàm lọc từ state.js
                    // (Sử dụng tên hàm getKnowledgeData như trong tệp state.js của bạn)
                    const chaptersData = window.APP_STATE.getKnowledgeDataByFilter(
                        selectedGradeName,
                        selectedSubjectName,
                        selectedBookName
                    );

                    // Lưu kết quả lọc vào state (để các hàm khác có thể dùng)
                    APP_STATE.setKnowledgeData(chaptersData);

                    // Render cây kiến thức với dữ liệu đã lọc
                    renderKnowledgeContent(chaptersData);
                }
            });
        });
    </script>
</body>
