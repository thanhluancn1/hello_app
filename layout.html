<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="{{ url_for('static', filename='js/student_management/index.js') }}"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#1e5eff',
                        'text-primary': '#121212',
                        'text-secondary': '#5a607f',
                        'text-muted': '#a1a7c4',
                        'border-light': '#e6e9f4',
                        'border-medium': '#d9e1ec',
                        'border-checkbox': '#d7dbec',
                        'bg-light': '#f5f6fa',
                        'status-active': '#06a561',
                        'status-active-bg': '#defef0',
                        'status-inactive': '#ff5c5c',
                        'status-inactive-bg': '#ffdfdf'
                    },
                    fontFamily: {
                        'roboto': ['Roboto', 'sans-serif'],
                        'inter': ['Inter', 'sans-serif'],
                        'gilroy': ['Gilroy', 'sans-serif'],
                        'manrope': ['Manrope', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bg-light min-h-screen">
    <header class="bg-white shadow-sm border-b border-border-light h-16 flex items-center justify-between px-6">
        <div class="flex items-center">
            <div class="flex items-center">
                <img src="https://picsum.photos/40?random=1" alt="Logo" class="w-10 h-10 mr-3 rounded">
                <span class="text-xl font-bold font-gilroy text-text-primary">AronEdu</span>
            </div>
        </div>
        
        <div class="flex items-center space-x-4">
            <div class="relative">
                <img src="https://unpkg.com/lucide-static/icons/message-square.svg" alt="Chat" class="w-6 h-6">
            </div>
            
            <div class="relative">
                <img src="https://unpkg.com/lucide-static/icons/bell.svg" alt="Notifications" class="w-6 h-6">
                <span class="absolute -top-1 -right-1 bg-primary text-white text-xs rounded-full w-4 h-4 flex items-center justify-center">5</span>
            </div>
            
            <div class="flex items-center space-x-3">
                <div class="relative">
                    <img src="https://picsum.photos/36?random=2" alt="User Avatar" class="w-9 h-9 rounded-full">
                </div>
                <span class="text-text-secondary text-sm font-inter">Thanh Luan</span>
                <img src="https://unpkg.com/lucide-static/icons/chevron-down.svg" alt="Dropdown" class="w-6 h-6">
            </div>
        </div>
    </header>

    <div class="flex h-screen">
        <aside class="w-64 bg-white shadow-lg flex-shrink-0">
            <div class="p-4 space-y-2">
                <div class="flex items-center p-3 rounded hover:bg-gray-50 cursor-pointer">
                    <img src="https://unpkg.com/lucide-static/icons/home.svg" alt="Dashboard" class="w-6 h-6 mr-3">
                    <span class="text-text-secondary text-sm font-inter">Trang chủ</span>
                </div>
                
                <div class="flex items-center p-3 rounded hover:bg-gray-50 cursor-pointer">
                    <img src="https://unpkg.com/lucide-static/icons/list.svg" alt="Student Management" class="w-6 h-6 mr-3">
                    <a href="/classes" class="text-text-secondary text-sm font-inter">Quản lý lớp học</a>
                </div>

                <div class="flex items-center p-3 rounded bg-primary text-white cursor-pointer">
                    <img src="https://unpkg.com/lucide-static/icons/tag.svg" alt="Class Management" class="w-6 h-6 mr-3" style="filter: invert(100%) sepia(100%) saturate(0%) hue-rotate(148deg) brightness(102%) contrast(102%);">
                    <a href="/students" class="text-sm font-inter">Quản lý học sinh</a>
                </div>
                
                <div class="flex items-center p-3 rounded hover:bg-gray-50 cursor-pointer">
                    <img src="https://unpkg.com/lucide-static/icons/folder.svg" alt="Categories" class="w-6 h-6 mr-3">
                    <a href="/schedules" class="text-text-secondary text-sm font-inter">Quản lý lịch học</a>
                </div>

                <div class="flex items-center p-3 rounded hover:bg-gray-50 cursor-pointer">
                    <img src="https://unpkg.com/lucide-static/icons/layout-grid.svg" alt="Categories" class="w-6 h-6 mr-3">
                    <a href="/lessons" class="text-text-secondary text-sm font-inter">Quản lý bài giảng</a>
                </div>
                
                <div class="flex items-center p-3 rounded hover:bg-gray-50 cursor-pointer">
                    <img src="https://unpkg.com/lucide-static/icons/users.svg" alt="Customers" class="w-6 h-6 mr-3">
                    <span class="text-text-secondary text-sm font-inter">Quản lý kho nội dung</span>
                </div>
                
                <div class="flex items-center p-3 rounded hover:bg-gray-50 cursor-pointer">
                    <img src="https://unpkg.com/lucide-static/icons/bar-chart-2.svg" alt="Reports" class="w-6 h-6 mr-3">
                    <span class="text-text-secondary text-sm font-inter">Tạo đề thi</span>
                </div>
                
                <div class="flex items-center p-3 rounded hover:bg-gray-50 cursor-pointer">
                    <img src="https://unpkg.com/lucide-static/icons/star.svg" alt="Coupons" class="w-6 h-6 mr-3">
                    <span class="text-text-secondary text-sm font-inter">Tạo bài tập</span>
                </div>
                
                <div class="pt-4">
                    <p class="text-text-muted text-xs font-inter px-3 mb-2">Báo cáo</p>
                </div>
                
                <div class="flex items-center p-3 rounded hover:bg-gray-50 cursor-pointer">
                    <img src="https://unpkg.com/lucide-static/icons/layout-grid.svg" alt="Applications" class="w-6 h-6 mr-3">
                    <span class="text-text-secondary text-sm font-inter">Thời gian làm việc giáo viên</span>
                </div>
                
                <div class="flex items-center p-3 rounded hover:bg-gray-50 cursor-pointer">
                    <img src="https://unpkg.com/lucide-static/icons/help-circle.svg" alt="Knowledge Base" class="w-6 h-6 mr-3">
                    <span class="text-text-secondary text-sm font-inter">Phân tích Lớp học</span>
                </div>
                
                <div class="flex items-center p-3 rounded hover:bg-gray-50 cursor-pointer">
                    <img src="https://unpkg.com/lucide-static/icons/ribbon.svg" alt="Product Updates" class="w-6 h-6 mr-3">
                    <span class="text-text-secondary text-sm font-inter">Phân tích học sinh</span>
                </div>
                
                <div class="pt-4">
                    <p class="text-text-muted text-xs font-inter px-3 mb-2">Cài đặt</p>
                </div>
                
                <div class="flex items-center p-3 rounded hover:bg-gray-50 cursor-pointer">
                    <img src="https://unpkg.com/lucide-static/icons/user.svg" alt="Personal Settings" class="w-6 h-6 mr-3">
                    <span class="text-text-secondary text-sm font-inter">Cài đặt cá nhân</span>
                </div>
                
                <div class="flex items-center p-3 rounded hover:bg-gray-50 cursor-pointer">
                    <img src="https://unpkg.com/lucide-static/icons/settings.svg" alt="Global Settings" class="w-6 h-6 mr-3">
                    <span class="text-text-secondary text-sm font-inter">Cài đặt chung</span>
                </div>
            </div>
        </aside>

        <div class="flex-1 flex flex-col">
            <main class="flex-1 p-6 bg-bg-light">
                
            </main>
        </div>
    </div>

   

</body>
</html>
